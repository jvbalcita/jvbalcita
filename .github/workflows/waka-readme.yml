name: Update development metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: development-metrics
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update lifetime development stats
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate development metrics
        uses: anmol098/waka-readme-stats@e88db93786730a2ada98faaea4bfcfec7d29737f
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LINES_OF_CODE: 'True'
          SHOW_TOTAL_CODE_TIME: 'False'
          SHOW_AI_CODE_TIME: 'False'
          SHOW_PROFILE_VIEWS: 'True'
          SHOW_COMMIT: 'True'
          SHOW_DAYS_OF_WEEK: 'True'
          SHOW_LANGUAGE: 'False'
          SHOW_OS: 'False'
          SHOW_PROJECTS: 'False'
          SHOW_TIMEZONE: 'False'
          SHOW_EDITORS: 'False'
          SHOW_LANGUAGE_PER_REPO: 'True'
          SHOW_SHORT_INFO: 'True'
          SHOW_LOC_CHART: 'True'
          SHOW_AI_CODING: 'False'
          SHOW_UPDATED_DATE: 'True'
          BAR_STYLE: 'text'
          COMMIT_MESSAGE: 'docs: update lifetime development metrics'
